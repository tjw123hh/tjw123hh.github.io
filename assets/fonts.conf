<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'urn:fontconfig:fonts.dtd'>

<!-- 注：此处带有 `CHWS Patch` 的字体是我自己添加了 `chws` OpenType 特性的补丁字体，见[我的这篇文章](https://tjw123hh.github.io/2024/07/28/Linux-在字体层面实现标点挤压/) -->

<fontconfig>
    <!-- Replace Source Han -->
    <match target="pattern">
        <test name="family" qual="any">
            <string>Source Han Sans</string>
        </test>
        <edit binding="same" mode="assign" name="family">
            <string>Noto Sans CJK SC</string>
        </edit>
    </match>
    <match target="pattern">
        <test name="family" qual="any">
            <string>Source Han Serif</string>
        </test>
        <edit binding="same" mode="assign" name="family">
            <string>Noto Serif CJK SC</string>
        </edit>
    </match>
    <!-- Default system-ui fonts -->
    <match target="pattern">
        <test name="family">
            <string>system-ui</string>
        </test>
        <edit binding="strong" mode="prepend" name="family">
            <string>sans-serif</string>
        </edit>
    </match>
    <!-- 禁止 Firefox 上的网页自定义字体（除了字体名带 icon 的图标字体），可视情况删去 -->
    <match target="pattern">
        <test name="prgname">
            <string>firefox</string>
        </test>
        <test name="family" compare="not_contains">
            <string>icon</string>
        </test>
        <test name="family" compare="not_eq">
            <string>sans-serif</string>
        </test>
        <test name="family" compare="not_eq">
            <string>serif</string>
        </test>
        <test name="family" compare="not_eq">
            <string>monospace</string>
        </test>
        <edit name="family" mode="delete" />
    </match>
    <!-- Default monospace fonts-->
    <match target="pattern">
        <test name="family">
            <string>monospace</string>
        </test>
        <edit binding="strong" mode="prepend" name="family">
            <string>JetBrainsMono Nerd Font</string>
            <string>Noto Sans Mono</string>
            <string>Noto Sans Mono CJK SC</string>
            <string>Noto Color Emoji</string>
            <string>遍黑体P1</string>
            <string>遍黑体P2</string>
        </edit>
    </match>
    <!-- Default sans-serif fonts-->
    <match target="pattern">
        <test name="family">
            <string>sans-serif</string>
        </test>
        <edit binding="strong" mode="prepend" name="family">
            <string>Noto Sans CJK CHWS Patch SC</string>
            <string>Noto Sans</string>
            <string>Noto Sans CJK SC</string>
            <string>Noto Color Emoji</string>
            <string>遍黑体P1</string>
            <string>遍黑体P2</string>
        </edit>
    </match>
    <!-- Default serif fonts-->
    <match target="pattern">
        <test name="family">
            <string>serif</string>
        </test>
        <edit binding="strong" mode="prepend" name="family">
            <string>Noto Serif CJK CHWS Patch SC</string>
            <string>Noto Serif</string>
            <string>Noto Serif CJK SC</string>
            <string>Noto Color Emoji</string>
            <string>TH-Tshyn-P0</string>
            <string>TH-Tshyn-P1</string>
            <string>TH-Tshyn-P2</string>
            <string>TH-Tshyn-P16</string>
            <string>TH-Times</string>
        </edit>
    </match>
    <!-- 楷体！-->
    <match target="pattern">
        <test name="family">
            <string>kai</string>
        </test>
        <edit binding="strong" mode="prepend" name="family">
            <string>AR PL Ukai CHWS Patch CN</string>
            <string>Noto Serif</string>
            <string>AR PL Ukai CN</string>
            <string>LXGW Wenkai GB</string>
            <string>Noto Color Emoji</string>
            <string>TH-Tshyn-P0</string>
            <string>TH-Tshyn-P1</string>
            <string>TH-Tshyn-P2</string>
            <string>TH-Tshyn-P16</string>
            <string>TH-Times</string>
        </edit>
    </match>
    <!-- 仿宋！-->
    <match target="pattern">
        <test name="family">
            <string>fangsong</string>
        </test>
        <edit binding="strong" mode="prepend" name="family">
            <string>Zhuque Fangsong (technical preview)</string>
            <string>Noto Serif</string>
            <string>Noto Serif CJK SC</string>
            <string>Noto Color Emoji</string>
            <string>TH-Tshyn-P0</string>
            <string>TH-Tshyn-P1</string>
            <string>TH-Tshyn-P2</string>
            <string>TH-Tshyn-P16</string>
            <string>TH-Times</string>
        </edit>
    </match>
    <match target="pattern">
        <test compare="contains" name="family">
            <string>Source Code</string>
        </test>
        <edit binding="strong" name="family">
            <string>JetBrainsMono Nerd Font</string>
        </edit>
    </match>
    <!-- 统一语言标识 -->
    <match target="pattern">
        <test name="lang">
            <string>zh-Hant-TW</string>
        </test>
        <edit binding="same" mode="assign" name="lang">
            <string>zh-TW</string>
        </edit>
    </match>
    <match target="pattern">
        <test name="lang">
            <string>zh-Hant-HK</string>
        </test>
        <edit binding="same" mode="assign" name="lang">
            <string>zh-HK</string>
        </edit>
    </match>
    <!-- 解决全角引号 -->
    <match target="pattern">
        <test compare="not_contains" name="lang" qual="first">
            <string>zh</string>
        </test>
        <test compare="not_contains" name="lang" qual="first">
            <string>ja</string>
        </test>
        <test compare="not_contains" name="lang" qual="first">
            <string>ko</string>
        </test>
        <test compare="contains" name="family">
            <string>CHWS Patch</string>
        </test>
        <edit mode="delete" name="family"/>
    </match>
    <!-- Replace fonts for Chinese (Hong Kong) -->
    <match target="pattern">
        <test name="lang">
            <string>zh-HK</string>
        </test>
        <test name="family">
            <string>Noto Sans CJK SC</string>
        </test>
        <edit binding="strong" name="family">
            <string>Noto Sans CJK HK</string>
        </edit>
    </match>
    <match target="pattern">
        <test name="lang">
            <string>zh-HK</string>
        </test>
        <test name="family">
            <string>Noto Sans CJK CHWS Patch SC</string>
        </test>
        <edit binding="strong" name="family">
            <string>Noto Sans CJK CHWS Patch HK</string>
        </edit>
    </match>
    <match target="pattern">
        <test name="lang">
            <string>zh-HK</string>
        </test>
        <test name="family">
            <string>Noto Serif CJK SC</string>
        </test>
        <edit binding="strong" name="family">
            <string>Noto Serif CJK HK</string>
        </edit>
    </match>
    <match target="pattern">
        <test name="lang">
            <string>zh-HK</string>
        </test>
        <test name="family">
            <string>Noto Serif CJK CHWS Patch SC</string>
        </test>
        <edit binding="strong" name="family">
            <string>Noto Serif CJK CHWS Patch HK</string>
        </edit>
    </match>
    <match target="pattern">
        <test name="lang">
            <string>zh-HK</string>
        </test>
        <test name="family">
            <string>Noto Sans Mono CJK SC</string>
        </test>
        <edit binding="strong" name="family">
            <string>Noto Sans Mono CJK HK</string>
        </edit>
    </match>
    <match target="pattern">
        <test name="lang">
            <string>zh-HK</string>
        </test>
        <test name="family">
            <string>AR PL Ukai CN</string>
        </test>
        <edit binding="strong" name="family">
            <string>AR PL Ukai HK</string>
        </edit>
    </match>
    <match target="pattern">
        <test name="lang">
            <string>zh-HK</string>
        </test>
        <test name="family">
            <string>AR PL Ukai CHWS Patch CN</string>
        </test>
        <edit binding="strong" name="family">
            <string>AR PL Ukai CHWS Patch HK</string>
        </edit>
    </match>
    <!-- Replace fonts for Chinese (Taiwan) -->
    <match target="pattern">
        <test name="lang">
            <string>zh-TW</string>
        </test>
        <test name="family">
            <string>Noto Sans CJK SC</string>
        </test>
        <edit binding="strong" name="family">
            <string>Noto Sans CJK TC</string>
        </edit>
    </match>
    <match target="pattern">
        <test name="lang">
            <string>zh-TW</string>
        </test>
        <test name="family">
            <string>Noto Sans CJK CHWS Patch SC</string>
        </test>
        <edit binding="strong" name="family">
            <string>Noto Sans CJK CHWS Patch TC</string>
        </edit>
    </match>
    <match target="pattern">
        <test name="lang">
            <string>zh-TW</string>
        </test>
        <test name="family">
            <string>Noto Serif CJK SC</string>
        </test>
        <edit binding="strong" name="family">
            <string>Noto Serif CJK TC</string>
        </edit>
    </match>
    <match target="pattern">
        <test name="lang">
            <string>zh-TW</string>
        </test>
        <test name="family">
            <string>Noto Serif CJK CHWS Patch SC</string>
        </test>
        <edit binding="strong" name="family">
            <string>Noto Serif CJK CHWS Patch TC</string>
        </edit>
    </match>
    <match target="pattern">
        <test name="lang">
            <string>zh-TW</string>
        </test>
        <test name="family">
            <string>Noto Sans Mono CJK SC</string>
        </test>
        <edit binding="strong" name="family">
            <string>Noto Sans Mono CJK TC</string>
        </edit>
    </match>
    <match target="pattern">
        <test name="lang">
            <string>zh-TW</string>
        </test>
        <test name="family">
            <string>AR PL Ukai CHWS Patch CN</string>
        </test>
        <edit binding="strong" name="family">
            <string>AR PL Ukai CHWS Patch TW</string>
        </edit>
    </match>
    <match target="pattern">
        <test name="lang">
            <string>zh-TW</string>
        </test>
        <test name="family">
            <string>AR PL Ukai CN</string>
        </test>
        <edit binding="strong" name="family">
            <string>AR PL Ukai TW</string>
        </edit>
    </match>
    <match target="pattern">
        <test name="lang">
            <string>zh-TW</string>
        </test>
        <test name="family">
            <string>AR PL Ukai CHWS Patch CN</string>
        </test>
        <edit binding="strong" name="family">
            <string>AR PL Ukai CHWS Patch TW</string>
        </edit>
    </match>
    <!-- Replace fonts for Japanese -->
    <match target="pattern">
        <test compare="contains" name="lang">
            <string>ja</string>
        </test>
        <test name="family">
            <string>Noto Sans CJK SC</string>
        </test>
        <edit binding="strong" name="family">
            <string>Noto Sans CJK JP</string>
        </edit>
    </match>
    <match target="pattern">
        <test compare="contains" name="lang">
            <string>ja</string>
        </test>
        <test name="family">
            <string>Noto Sans CJK CHWS Patch SC</string>
        </test>
        <edit binding="strong" name="family">
            <string>Noto Sans CJK CHWS Patch JP</string>
        </edit>
    </match>
    <match target="pattern">
        <test compare="contains" name="lang">
            <string>ja</string>
        </test>
        <test name="family">
            <string>Noto Serif CJK SC</string>
        </test>
        <edit binding="strong" name="family">
            <string>Noto Serif CJK JP</string>
        </edit>
    </match>
    <match target="pattern">
        <test compare="contains" name="lang">
            <string>ja</string>
        </test>
        <test name="family">
            <string>Noto Serif CJK CHWS Patch SC</string>
        </test>
        <edit binding="strong" name="family">
            <string>Noto Serif CJK CHWS Patch JP</string>
        </edit>
    </match>
    <match target="pattern">
        <test compare="contains" name="lang">
            <string>ja</string>
        </test>
        <test name="family">
            <string>Noto Sans Mono CJK SC</string>
        </test>
        <edit binding="strong" name="family">
            <string>Noto Sans Mono CJK JP</string>
        </edit>
    </match>
    <!-- Replace fonts for Korean -->
    <match target="pattern">
        <test compare="contains" name="lang">
            <string>ko</string>
        </test>
        <test name="family">
            <string>Noto Sans CJK SC</string>
        </test>
        <edit binding="strong" name="family">
            <string>Noto Sans CJK KR</string>
        </edit>
    </match>
    <match target="pattern">
        <test compare="contains" name="lang">
            <string>ko</string>
        </test>
        <test name="family">
            <string>Noto Sans CJK CHWS Patch SC</string>
        </test>
        <edit binding="strong" name="family">
            <string>Noto Sans CJK CHWS Patch KR</string>
        </edit>
    </match>
    <match target="pattern">
        <test compare="contains" name="lang">
            <string>ko</string>
        </test>
        <test name="family">
            <string>Noto Serif CJK SC</string>
        </test>
        <edit binding="strong" name="family">
            <string>Noto Serif CJK KR</string>
        </edit>
    </match>
    <match target="pattern">
        <test compare="contains" name="lang">
            <string>ko</string>
        </test>
        <test name="family">
            <string>Noto Serif CJK CHWS Patch SC</string>
        </test>
        <edit binding="strong" name="family">
            <string>Noto Serif CJK CHWS Patch KR</string>
        </edit>
    </match>
    <match target="pattern">
        <test compare="contains" name="lang">
            <string>ko</string>
        </test>
        <test name="family">
            <string>Noto Sans Mono CJK SC</string>
        </test>
        <edit binding="strong" name="family">
            <string>Noto Sans Mono CJK KR</string>
        </edit>
    </match>
    <!--rendering options-->
    <match target="font">
        <test compare="contains" name="family">
            <string>Noto</string>
        </test>
        <test compare="contains" name="family">
            <string>CJK</string>
        </test>
        <test compare="not_contains" name="family">
            <string>Mono</string>
        </test>
        <edit binding="strong" name="fontfeatures">
            <string>chws</string>
            <string>vchw</string>
        </edit>
    </match>
    <match target="font">
        <test compare="contains" name="family">
            <string>Ukai</string>
        </test>
        <edit binding="strong" name="fontfeatures">
            <string>chws</string>
            <string>vchw</string>
        </edit>
    </match>
    <match target="font">
        <test compare="contains" name="family">
            <string>Zhuque Fangsong</string>
        </test>
        <edit binding="strong" name="fontfeatures">
            <string>chws</string>
            <string>vchw</string>
        </edit>
    </match>
    <match target="font">
        <edit binding="strong" mode="assign" name="autohint">
            <bool>false</bool>
        </edit>
        <edit binding="strong" mode="assign" name="hinting">
            <bool>true</bool>
        </edit>
        <edit binding="strong" mode="assign" name="hintstyle">
            <const>hintslight</const>
        </edit>
        <edit binding="strong" mode="assign" name="antialias">
            <bool>true</bool>
        </edit>
        <edit binding="strong" mode="assign" name="lcdfilter">
            <const>lcddefault</const>
        </edit>
        <edit binding="strong" mode="assign" name="rgba">
            <const>rgb</const>
        </edit>
    </match>
    <dir>~/.fonts</dir>
    <dir>~/.local/share/fonts</dir>
</fontconfig>
